name: CI

# Issue #32: run the test suites on every pull request (open / update / reopen),
# and on pushes to main only. No deploy steps -- test-only CI.
# Feature-branch pushes do not trigger CI; they run via their pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# Least privilege: CI only needs to read the checked-out code.
permissions:
  contents: read

# Cancel an in-progress run when the same PR is updated again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Python 3.12: stable, with prebuilt wheels for pandas/matplotlib/
      # yfinance/boto3, and new enough for the codebase's `X | None` syntax.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The seven component suites are run as separate pytest processes -- the
      # project has no root pytest config / conftest.py, and each test file
      # sets up its own sys.path. Separate steps keep component namespaces
      # isolated and make a failing component obvious from the step name.
      # These tests need no secrets / .env: they use tmp_path and monkeypatch
      # and never reach Discord, AWS/S3, external APIs, or a real database.
      - name: Run backtest tests
        run: python -m pytest backtest/tests -q

      - name: Run market-watch tests
        run: python -m pytest market-watch/tests -q

      - name: Run news-feed-bot tests
        run: python -m pytest news-feed-bot/tests -q

      - name: Run paper-signal tests
        run: python -m pytest paper-signal/tests -q

      - name: Run paper-execution tests
        run: python -m pytest paper-execution/tests -q

      # Issue #73: broker boundary for the future Live Execution layer.
      # In-memory only -- no network, no DB, no tmp files.
      - name: Run broker tests
        run: python -m pytest broker/tests -q

      # Issue #74: ExecutionRequest model + order-state persistence for the
      # future Live Execution layer. tmp_path SQLite only -- no network.
      - name: Run execution tests
        run: python -m pytest execution/tests -q

      # Issue #77: fixed execution scenarios via the runner CLI. The same
      # scenarios also run inside "Run execution tests" (test_fixed_scenarios
      # parametrizes per scenario id) -- including the Issue #78 shadow-mode
      # scenarios, so they are NOT re-run as a separate CLI step; this extra
      # step pins the CLI contract -- human-readable per-scenario PASS/FAIL
      # output and a non-zero exit code on any mismatch -- and costs ~2s.
      # tmp-dir SQLite + FakeBroker only: no secrets, no network, fully
      # reproducible.
      - name: Run fixed execution scenarios (CLI)
        run: python -m execution.scenario_runner

      # Issue #78 / PR #100: the shadow-mode CLI contract, end to end. dry-run
      # first (must create nothing), a CLI FIXTURE cycle (labelled
      # cli_fixture), a PRODUCTION SIGNAL cycle (a signal stored via the real
      # Paper Signal store, resolved through the production providers), a
      # dry-run over the EXISTING stores (file list must stay identical), and
      # the report CLI whose --json output is parsed for real. Deterministic
      # via --now; tmp-dir SQLite only, no secrets, no network, no broker
      # anywhere in the path.
      - name: Run shadow mode CLI (dry-run, fixture + production cycles, report)
        run: |
          set -e
          python -m execution.shadow_runner --mode dry-run --cycle execution/examples/shadow_cycle_example.json --data-dir "$RUNNER_TEMP/shadow-ci" --now 2026-01-01T00:00:00+00:00
          test ! -e "$RUNNER_TEMP/shadow-ci" || { echo "dry-run must not create DB files"; exit 1; }
          python -m execution.shadow_runner --mode shadow --cycle execution/examples/shadow_cycle_example.json --data-dir "$RUNNER_TEMP/shadow-ci" --now 2026-01-01T00:00:00+00:00 | tee fixture-cycle.out
          grep -q "origin=cli_fixture" fixture-cycle.out
          python -c "import sys,os; sys.path.insert(0,'paper-signal'); from pathlib import Path; import paper_signal_store; db=Path(os.environ['RUNNER_TEMP'])/'shadow-ci-signals'/'paper_signals.sqlite3'; db.parent.mkdir(parents=True,exist_ok=True); paper_signal_store.save_signal({'signal_id':'ci-signal-1','created_at_utc':'2026-01-01T00:00:00+00:00','symbol':'USD_JPY','timeframe':'H1','side':'long','market_bias':'Bull','confidence':0.9,'macd_state':'bullish','trend':'up','state':'trend','freshness':'fresh','reason':'ci seed','status':'paper_only'}, db_path=db)"
          python -m execution.shadow_runner --mode shadow --signal-id ci-signal-1 --signal-db "$RUNNER_TEMP/shadow-ci-signals/paper_signals.sqlite3" --execution-config execution/examples/shadow_execution_config_example.json --market-snapshot execution/examples/market_snapshot_example.json --account-snapshot execution/examples/account_snapshot_example.json --data-dir "$RUNNER_TEMP/shadow-ci" --now 2026-01-01T00:00:00+00:00 | tee production-cycle.out
          grep -q "origin=production_signal" production-cycle.out
          find "$RUNNER_TEMP/shadow-ci" -type f | sort > files-before.txt
          python -m execution.shadow_runner --mode dry-run --cycle execution/examples/shadow_cycle_example.json --data-dir "$RUNNER_TEMP/shadow-ci" --now 2026-01-01T00:00:00+00:00
          find "$RUNNER_TEMP/shadow-ci" -type f | sort > files-after.txt
          diff files-before.txt files-after.txt
          python -m execution.shadow_report --shadow-db "$RUNNER_TEMP/shadow-ci/shadow_results.sqlite3" --decision-db "$RUNNER_TEMP/shadow-ci/safety_gate_decisions.sqlite3" | tee report.out
          grep -q "origin=production_signal" report.out
          python -m execution.shadow_report --shadow-db "$RUNNER_TEMP/shadow-ci/shadow_results.sqlite3" --decision-db "$RUNNER_TEMP/shadow-ci/safety_gate_decisions.sqlite3" --json > shadow-report.json
          python -c "import json; data=json.load(open('shadow-report.json', encoding='ascii')); assert data['count'] == 2, data"
          python -m execution.shadow_report --shadow-db "$RUNNER_TEMP/shadow-ci/shadow_results.sqlite3" --decision-db "$RUNNER_TEMP/shadow-ci/safety_gate_decisions.sqlite3" --orphan-decisions

      # PR #87: broker/ must import as a normal package from the repo root,
      # without any sys.path manipulation. Issue #74 adds execution/ under
      # the same rule; Issue #75 adds the Safety Gate modules; Issue #77 adds
      # the scenario runner modules.
      - name: Verify root-level broker package imports
        run: |
          python -c "from broker.broker_interface import Broker"
          python -c "from broker.broker_models import OrderRequest, OrderResult"
          python -c "from broker.fake_broker import FakeBroker"
          python -c "from execution.execution_models import ExecutionRequest"
          python -c "from execution import execution_store"
          python -c "from execution.safety_gate import BrokerConnection, SafetyGate, SafetyPolicy"
          python -c "from execution.safety_store import SQLiteSafetyDecisionStore"
          python -c "from execution.live_submission import LiveOrderSubmissionService"
          python -c "from execution.scenario_models import load_scenarios, validate_scenario"
          python -c "from execution.scenario_runner import main, run_scenarios"
          python -c "from execution.shadow_models import ShadowResult, intended_order_from_request"
          python -c "from execution import shadow_store"
          python -c "from execution.shadow_execution import ShadowExecutionService"
          python -c "from execution.shadow_providers import PaperSignalDbSignalProvider, StoredSignal"
          python -c "from execution.shadow_config import load_shadow_execution_config"
          python -c "from execution.shadow_composition import run_production_shadow_cycle"
          python -c "from execution.sqlite_ro import connect_read_only"
          python -c "from execution.strict_json import load_strict_json_file"
          python -c "from execution.shadow_runner import main"
          python -c "from execution.shadow_report import main"

  # Issue #83: the Paper Execution notification outbox does dry-run schema
  # probing and reads via private snapshot copies, then deletes the snapshot
  # TemporaryDirectory. On Windows an unclosed SQLite connection keeps the file
  # handle open and cleanup fails with WinError 32, so the dry-run / snapshot
  # paths must be exercised on Windows too. Scoped to paper-execution to keep
  # this job fast.
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run paper-execution tests (Windows)
        run: python -m pytest paper-execution/tests -q

      # PR #96 review r1 (Issue #77): the scenario CLI must not depend on the
      # console encoding. Windows pipes stdout through the ANSI codepage (not
      # UTF-8), so an encoding regression that would crash the default
      # Japanese cp932 console fails here too. PYTHONUTF8 is deliberately NOT
      # set. Same isolation as the Ubuntu step: FakeBroker + per-scenario
      # tmp-dir SQLite, no secrets, no network.
      - name: Run fixed execution scenarios CLI (Windows)
        run: |
          python -m execution.scenario_runner
          python -m execution.scenario_runner --list
          python -m execution.scenario_runner --json

      # Issue #78: the shadow CLIs must keep their exit-code contract on the
      # Windows ANSI-codepage console too (cp932-equivalent; PYTHONUTF8 is
      # deliberately NOT set). Also pins the execution pytest suite -- which
      # holds the shadow SQLite file-handle / dry-run no-side-effect tests --
      # on Windows.
      - name: Run execution tests (Windows)
        run: python -m pytest execution/tests -q

      - name: Run shadow mode CLI (Windows)
        run: |
          $ErrorActionPreference = "Stop"
          python -m execution.shadow_runner --mode dry-run --cycle execution/examples/shadow_cycle_example.json --data-dir "$env:RUNNER_TEMP/shadow-ci" --now 2026-01-01T00:00:00+00:00
          if ($LASTEXITCODE -ne 0) { throw "dry-run failed" }
          if (Test-Path "$env:RUNNER_TEMP/shadow-ci") { throw "dry-run must not create DB files" }
          python -m execution.shadow_runner --mode shadow --cycle execution/examples/shadow_cycle_example.json --data-dir "$env:RUNNER_TEMP/shadow-ci" --now 2026-01-01T00:00:00+00:00
          if ($LASTEXITCODE -ne 0) { throw "fixture cycle failed" }
          python -c "import sys,os; sys.path.insert(0,'paper-signal'); from pathlib import Path; import paper_signal_store; db=Path(os.environ['RUNNER_TEMP'])/'shadow-ci-signals'/'paper_signals.sqlite3'; db.parent.mkdir(parents=True,exist_ok=True); paper_signal_store.save_signal({'signal_id':'ci-signal-1','created_at_utc':'2026-01-01T00:00:00+00:00','symbol':'USD_JPY','timeframe':'H1','side':'long','market_bias':'Bull','confidence':0.9,'macd_state':'bullish','trend':'up','state':'trend','freshness':'fresh','reason':'ci seed','status':'paper_only'}, db_path=db)"
          if ($LASTEXITCODE -ne 0) { throw "signal seeding failed" }
          python -m execution.shadow_runner --mode shadow --signal-id ci-signal-1 --signal-db "$env:RUNNER_TEMP/shadow-ci-signals/paper_signals.sqlite3" --execution-config execution/examples/shadow_execution_config_example.json --market-snapshot execution/examples/market_snapshot_example.json --account-snapshot execution/examples/account_snapshot_example.json --data-dir "$env:RUNNER_TEMP/shadow-ci" --now 2026-01-01T00:00:00+00:00 | Tee-Object production-cycle.out
          if ($LASTEXITCODE -ne 0) { throw "production cycle failed" }
          if (-not (Select-String -Path production-cycle.out -Pattern "origin=production_signal" -Quiet)) { throw "production provenance missing" }
          python -m execution.shadow_report --shadow-db "$env:RUNNER_TEMP/shadow-ci/shadow_results.sqlite3" --decision-db "$env:RUNNER_TEMP/shadow-ci/safety_gate_decisions.sqlite3"
          if ($LASTEXITCODE -ne 0) { throw "report failed" }
          python -m execution.shadow_report --shadow-db "$env:RUNNER_TEMP/shadow-ci/shadow_results.sqlite3" --decision-db "$env:RUNNER_TEMP/shadow-ci/safety_gate_decisions.sqlite3" --json > shadow-report.json
          if ($LASTEXITCODE -ne 0) { throw "json report failed" }
          python -c "import json; data=json.load(open('shadow-report.json', encoding='ascii')); assert data['count'] == 2, data"
          if ($LASTEXITCODE -ne 0) { throw "json parse failed" }
