name: Ops Task
description: 運用、定期作業、デプロイ、監視、整理タスク
title: "[Ops]: "
labels: ["type: ops"]
body:
  - type: textarea
    id: task
    attributes:
      label: 作業内容
      placeholder: 何をするIssueか
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 目的/背景
      placeholder: なぜ必要か。放置した場合の困りごと。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 作業手順
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: dropdown
    id: timing
    attributes:
      label: タイミング
      options:
        - One-shot
        - Daily
        - Weekly
        - Before deploy
        - After deploy
        - When incident happens
        - Other
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: ロールバック/注意点
      placeholder: 失敗時の戻し方、触ってはいけないもの、秘密情報など
    validations:
      required: false
